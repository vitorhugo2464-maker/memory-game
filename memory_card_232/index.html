<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da memória</title>
</head>
<!-- Link para o arquivo de estilização do CSS -->
<link rel="stylesheet" href="css/styles.css">

<body>   
  <section class="header">
    <h1><br>Jogo da memória<br></h1>
    <h2> Japa, Sena e Vitor<br><br></h2>  
  </section>

  <!-- Início do container principal -->
  <section class="memory-game">    
  
    <!-- Início das seções dos cards - 12 cards (cartões)-->
    <section class="memory-card" data-framework="The Last of Us">
      <!-- O que são Data Attributes?
        São atributos criados por você no HTML para guardar informações extras em uma tag 
        sem precisar criar classes ou IDs.Exemplo no HTML:<div data-status="ativo" 
        data-cor="azul">Texto</div>-->
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/tlouu.jfif" alt="The Last of Us" />
    </section>

    <section class="memory-card" data-framework="Red Dead">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/red.png" alt="Red Dead" />
    </section>

    <section class="memory-card" data-framework="assassin's creed">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/assasins.png" alt="assassin's creed" />
    </section>

    <section class="memory-card" data-framework="Grand Theft Auto">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/gta.jpg" alt="Grand Theft Auto" />
    </section>

    <section class="memory-card" data-framework="Roblox">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/roblox.jfif" alt="Roblox" />
    </section>

    <section class="memory-card" data-framework="Minecraft">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/mine.png" alt="Minecraft" />
    </section>

    <section class="memory-card" data-framework="Minecraft">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/mine.png" alt="Minecraft" />
    </section>

    <section class="memory-card" data-framework="assassin's creed">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/assasins.png" alt="assassin's creed" />
    </section>

    <section class="memory-card" data-framework="Grand Theft Auto">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/gta.jpg" alt="Grand Theft Auto" />
    </section>

    <section class="memory-card" data-framework="Red Dead">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/red.png" alt="Red Dead" />
    </section>

    <section class="memory-card" data-framework="Roblox">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/roblox.jfif" alt="Roblox" />
    </section>

    <section class="memory-card" data-framework="The Last of Us">
      <img class="front-face" src="img/ps.webp" alt="playstation" />
      <img class="back-face" src="img/tlouu.jfif" alt="The Last of Us" />
    </section>
    <!-- Fim das seções dos cards-->

  </section>
  <!-- Fim do container principal -->

  <!-- Link para o arquivo Javascript, que será iniciado na próxima semana -->
  <script src="js/scripts.js"></script>
</body>
</html>
